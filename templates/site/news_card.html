{% load static site_tags %}<article class="news-card"><a href="{{ prefix }}/news/{{ article.pk }}/">{% if article.image %}<img src="{{ article.image.url }}" alt="{% translated article 'title' lang %}" loading="lazy">{% else %}<img src="{% static 'img/production.webp' %}" alt="" loading="lazy">{% endif %}<time datetime="{{ article.published_at|date:'Y-m-d' }}">{{ article.published_at|date:'d.m.Y' }}</time><h3>{% translated article 'title' lang %}</h3><p>{% translated article 'description' lang %}</p><span class="inline-link">{% if is_ar %}اقرأ الخبر{% else %}Read article{% endif %}<span aria-hidden="true">↗</span></span></a></article>
