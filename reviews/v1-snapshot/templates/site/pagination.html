{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="{% if is_ar %}الصفحات{% else %}Pagination{% endif %}">{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}&q={{ q|urlencode }}&category={{ selected_category|urlencode }}">{% if is_ar %}السابق{% else %}Previous{% endif %}</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}&q={{ q|urlencode }}&category={{ selected_category|urlencode }}">{% if is_ar %}التالي{% else %}Next{% endif %}</a>{% endif %}</nav>{% endif %}
